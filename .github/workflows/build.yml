name: Build Tweak

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Install Theos
      run: |
        # 1. استنساخ Theos مع جميع submodules
        git clone --recursive https://github.com/theos/theos.git $HOME/theos
        
        # 2. تحديث يدوي للتأكد
        cd $HOME/theos
        git submodule update --init --recursive
        
        # 3. إعداد البيئة
        echo "THEOS=$HOME/theos" >> $GITHUB_ENV
        echo "$HOME/theos/bin" >> $GITHUB_PATH
        
        # 4. تثبيت dm.pl (أداة بناء الحزمة)
        if [ ! -f "$HOME/theos/bin/dm.pl" ]; then
          curl -L -o $HOME/theos/bin/dm.pl https://raw.githubusercontent.com/theos/theos/master/bin/dm.pl
          chmod +x $HOME/theos/bin/dm.pl
        fi

    - name: Install dependencies
      run: |
        # تثبيت libplist و ldid (مطلوبان للتوقيع والبناء)
        brew install libplist ldid || true

    - name: Setup Xcode
      run: sudo xcode-select -switch /Applications/Xcode.app/Contents/Developer

    - name: Build Tweak
      run: |
        export THEOS=$HOME/theos
        make package

    - name: Upload Debian Package
      uses: actions/upload-artifact@v4
      with:
        name: TouchRecorderTweak
        path: packages/*.deb

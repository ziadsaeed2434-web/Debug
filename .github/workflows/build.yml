name: Build Tweak

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Install Theos
      run: |
        git clone --depth=1 https://github.com/theos/theos.git $HOME/theos
        echo "THEOS=$HOME/theos" >> $GITHUB_ENV
        echo "$HOME/theos/bin" >> $GITHUB_PATH

    - name: Setup SDK
      run: |
        # استخدام SDK الخاص بـ macOS (محاكي iOS) – لكننا سنستخدم Theos's SDK
        sudo xcode-select -switch /Applications/Xcode.app/Contents/Developer
        # Theos سيتعامل مع SDK تلقائياً

    - name: Build Tweak
      run: |
        export THEOS=$HOME/theos
        make package

    - name: Upload Debian Package
      uses: actions/upload-artifact@v4
      with:
        name: TouchRecorderTweak
        path: packages/*.deb

name: Build Tweak

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Install Theos
      run: |
        git clone --depth=1 https://github.com/theos/theos.git $HOME/theos
        echo "THEOS=$HOME/theos" >> $GITHUB_ENV
        echo "$HOME/theos/bin" >> $GITHUB_PATH
        
        # تثبيت dm.pl (مطلوب لبناء حزمة .deb)
        if [ ! -f "$HOME/theos/bin/dm.pl" ]; then
          curl -L -o $HOME/theos/bin/dm.pl https://raw.githubusercontent.com/theos/theos/master/bin/dm.pl
          chmod +x $HOME/theos/bin/dm.pl
        fi
        
        # تثبيت libplist
        brew install libplist || true

    - name: Setup Xcode
      run: sudo xcode-select -switch /Applications/Xcode.app/Contents/Developer

    - name: Build Tweak
      run: |
        export THEOS=$HOME/theos
        make package

    - name: Upload Debian Package
      uses: actions/upload-artifact@v4
      with:
        name: TouchRecorderTweak
        path: packages/*.deb
